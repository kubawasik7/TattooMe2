<div class="box">
  <div class="sidebar">
    <div class="sidebar-header">💬 Czaty</div>

    <div class="chat-list" *ngIf="chats?.length; else empty">
      <button class="chat-item" *ngFor="let c of chats" [class.active]="c.id === activeChatId" (click)="openChat(c.id)">
        <div class="avatar">{{ (c.receiverName || '?') | slice:0:1 }}</div>
        <div class="meta">
          <div class="name">{{ c.receiverName || c.studioName || 'Rozmowa' }}</div>

        </div>
      </button>
    </div>

    <ng-template #empty>
      <div class="empty">Brak rozmów</div>
    </ng-template>
  </div>

  <div class="divider"></div>
  <div class="main" *ngIf="activeChatId; else pickChat">
    <div class="header">
      <div class="avatar big">{{ activeChatName | slice:0:1 }}</div>
      <div class="title">{{ activeChatName || 'Rozmowa' }}</div>
    </div>

    <div class="messages-container" #messagesContainer>
      <div class="messages">
        <div class="msg" *ngFor="let m of messages" [class.sent]="m.senderId === currentUserId">
          <div class="bubble">
            <div class="header">
              <ng-container *ngIf="m.studioName; else userName">
                <strong>studio: {{ m.studioName }}</strong>
                <span *ngIf="m.studioMemberName">- {{ m.studioMemberName }}</span>
              </ng-container>
              <ng-template #userName>
                <strong>{{ m.senderName }}</strong>
              </ng-template>
            </div>
            <div class="text">{{ m.content }}</div>
            <div class="date">{{ m.date | date:'shortTime' }}</div>
          </div>
        </div>
      </div>
    </div>

    <form class="composer" [formGroup]="form" (ngSubmit)="send()">
      <input class="input" formControlName="content" type="text" placeholder="Wpisz wiadomość..." />
      <button class="send" type="submit">➤</button>
    </form>
  </div>

  <ng-template #pickChat>
    <div class="placeholder">👉 Wybierz rozmowę po lewej</div>
  </ng-template>
</div>
