<section class="faq-section">
  <div class="faq-header">
    <h2>FAQ</h2>
    <button *ngIf="canEdit" class="btn-add-faq" (click)="toggleAddFaq()">
      {{ showAddForm ? 'Zamknij' : '+ Dodaj FAQ' }}
    </button>
  </div>

  <div *ngIf="canEdit && showAddForm" [formGroup]="faqForm" class="add-faq">
    <input formControlName="question" placeholder="Nowe pytanie" />
    <div class="error" *ngIf="faqForm.get('question')?.touched && faqForm.get('question')?.hasError('maxlength')">
      Pytanie nie może mieć więcej niż 150 znaków.
    </div>

    <textarea formControlName="answer" placeholder="Odpowiedź"></textarea>
    <div class="error" *ngIf="faqForm.get('answer')?.touched && faqForm.get('answer')?.hasError('maxlength')">
      Odpowiedź nie może mieć więcej niż 1000 znaków.
    </div>

    <button (click)="addFaq()" [disabled]="faqForm.invalid">Dodaj FAQ</button>
  </div>

  <div *ngIf="faqs.length > 0; else noFaq">
    <div *ngFor="let faq of faqs" class="faq-item">
      <button class="faq-question" (click)="toggleFaq(faq.id)">
        {{ faq.question }}
        <span class="arrow">{{ isOpen(faq.id) ? '▲' : '▼' }}</span>
      </button>

      <div class="faq-answer" *ngIf="isOpen(faq.id)">
        <p>{{ faq.answer }}</p>
        <button *ngIf="canEdit" class="btn-delete" (click)="deleteFaq(faq.id)">Usuń</button>
      </div>
    </div>
  </div>
  <ng-template #noFaq>
    <p class="no-faq">Brak pytań FAQ w tym studiu.</p>
  </ng-template>
</section>
