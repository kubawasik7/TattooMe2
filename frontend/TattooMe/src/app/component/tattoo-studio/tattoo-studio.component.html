<main class="container profile-page">
  <section class="profile-header">
    <div class="profile-avatar">
      <img [src]="defaultAvatar" alt="Profilowe studia" class="avatar-img" />
    </div>

    <div class="profile-info">
      <h2 class="nickname">{{ tattooStudio.name }}</h2>
      <h3 class="owner">Właściciel: {{ tattooStudio.ownerNickname }}</h3>

      <div class="studio-address">
        <p>{{ tattooStudio.city }}</p>
        <p>{{ tattooStudio.street }} {{ tattooStudio.streetNumber }}</p>
        <p>{{ tattooStudio.postalCode }}</p>
      </div>
    </div>

    <div class="profile-actions">
      <app-work-hour-mini [studioId]="studioId" (openEditor)="showWorkHourEditor = true">
      </app-work-hour-mini>

      <div class="profile-buttons">
        <button class="button-chat" *ngIf="!isLoggedIn" [routerLink]="['/login']">
          <i class="fa-solid fa-message"></i>
        </button>

        <button class="button-chat" *ngIf="isLoggedIn && !isMember" (click)="startChatWithStudio()">
          <i class="fa-solid fa-message"></i>
        </button>

      </div>
    </div>
  </section>

  <div *ngIf="showWorkHourEditor && canEdit" class="work-hour-editor-overlay">
    <app-work-hour [studioId]="studioId"></app-work-hour>
    <button class="btn-close" (click)="showWorkHourEditor=false">✖ Zamknij</button>
  </div>

  <section class="studio-members">
    <app-studio-member [studioId]="studioId" [users]="studioArtists" (membersUpdated)="loadMembers()">
    </app-studio-member>
  </section>
  
  <section class="studio-users studio-schedules">
    <div class="studio-users-header">
      <h2>Terminy tatuatorów</h2>
    </div>

    <hr class="divider"/>

    <div *ngIf="studioArtists.length > 0; else noArtists">
      <div *ngFor="let artist of studioArtists" class="user-wrapper">
        <div class="user-card artist-card" [class.expanded]="artist.showSlots">
          <div class="user-header artist-header" (click)="artist.showSlots = !artist.showSlots">
            <h3 class="nickname">
              <i class="fa-solid" [ngClass]="artist.showSlots ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
              <a [routerLink]="['/profile', artist.id]" class="artist-link">{{ artist.nickname }}</a>
            </h3>
          </div>

          <div *ngIf="artist.showSlots" class="artist-slots">
            <app-artist-date [userId]="artist.id" [studioId]="studioId" [isOwner]="artist.id === currentUserId"
              [isLoggedIn]="isLoggedIn">
            </app-artist-date>
          </div>
        </div>
      </div>
    </div>

    <ng-template #noArtists>
      <p>Brak artystów przypisanych do studia.</p>
    </ng-template>
  </section>

  <app-faq
    [currentUserRole]="currentUserRole"
    [studioId]="studioId">
  </app-faq>
</main>
