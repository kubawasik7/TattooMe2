<div class="info-container">
  <h2>Informacje</h2>
  <p class="info-subtitle">Te dane będą widoczne dla tatuatorów podczas składania rezerwacji.</p>

  <form [formGroup]="infoForm" class="info-form">
    <div class="form-group">
      <label for="allergies">Alergie</label>
      <textarea id="allergies" formControlName="allergies"></textarea>
      <div class="error" *ngIf="infoForm.get('allergies')?.touched && infoForm.get('allergies')?.hasError('maxlength')">
        Pole nie może mieć więcej niż 255 znaków
      </div>
    </div>

    <div class="form-group">
      <label for="chronicDiseases">Choroby przewlekłe</label>
      <textarea id="chronicDiseases" formControlName="chronicDiseases"></textarea>
      <div class="error"
        *ngIf="infoForm.get('chronicDiseases')?.touched && infoForm.get('chronicDiseases')?.hasError('maxlength')">
        Pole nie może mieć więcej niż 255 znaków
      </div>
    </div>

    <div class="form-group">
      <label for="medicines">Leki</label>
      <textarea id="medicines" formControlName="medicines"></textarea>
      <div class="error" *ngIf="infoForm.get('medicines')?.touched && infoForm.get('medicines')?.hasError('maxlength')">
        Pole nie może mieć więcej niż 255 znaków
      </div>
    </div>

    <div class="form-group">
      <label for="experiences">Doświadczenia</label>
      <textarea id="experiences" formControlName="experiences"></textarea>
      <div class="error"
        *ngIf="infoForm.get('experiences')?.touched && infoForm.get('experiences')?.hasError('maxlength')">
        Pole nie może mieć więcej niż 255 znaków
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn edit-btn" (click)="enableEdit()" *ngIf="!editMode">Edytuj informacje</button>
      <button type="button" class="btn save-btn" (click)="saveChanges()" *ngIf="editMode">Zapisz</button>
      <button type="button" class="btn cancel-btn" (click)="cancelChanges()" *ngIf="editMode">Anuluj</button>
    </div>
  </form>
</div>
