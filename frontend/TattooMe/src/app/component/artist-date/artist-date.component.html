<div class="mb-3">
  <button class="btn btn-primary" (click)="openNew()">+ Dodaj termin</button>
</div>

<table class="table">
  <thead>
    <tr>
      <th>Data</th><th>Dostępny</th><th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let s of slots">
      <td>{{ s.dateTime | date:'short' }}</td>
      <td>{{ s.available ? '✔' : '✖' }}</td>
      <td class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" (click)="toggle(s.id)">Toggle</button>
        <button class="btn btn-sm btn-danger" (click)="delete(s.id)">Usuń</button>
        <button *ngIf="s.available" class="btn btn-sm btn-success" (click)="book(s)">
          Book
        </button>
      </td>
    </tr>
  </tbody>
</table>

<div class="modal-backdrop fade show" *ngIf="isNewOpen || isBookingOpen"></div>

<div
  class="modal d-block"
  *ngIf="isNewOpen"
  role="dialog"
  aria-modal="true"
  (keydown.escape)="closeNew()"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="slotForm" (ngSubmit)="saveNew()">
        <div class="modal-header">
          <h5 class="modal-title">Nowy termin</h5>
          <button type="button" class="btn-close" aria-label="Close" (click)="closeNew()"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Data i godzina</label>
          <input type="datetime-local" class="form-control" formControlName="dateTime" />
          <div class="text-danger mt-1" *ngIf="slotForm.get('dateTime')?.touched && slotForm.get('dateTime')?.invalid">
            Wymagane
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" [disabled]="slotForm.invalid">Zapisz</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div
  class="modal d-block"
  *ngIf="isBookingOpen"
  role="dialog"
  aria-modal="true"
  (keydown.escape)="closeBooking()"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="bookingForm" (ngSubmit)="submitBooking()">
        <div class="modal-header">
          <h5 class="modal-title">Rezerwacja terminu</h5>
          <button type="button" class="btn-close" (click)="closeBooking()"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Imię i nazwisko</label>
          <input class="form-control" formControlName="clientName" />
          <label class="form-label mt-2">Kontakt (email/telefon)</label>
          <input class="form-control" formControlName="contact" />
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" [disabled]="bookingForm.invalid">Wyślij</button>
        </div>
      </form>
    </div>
  </div>
</div>
