<div class="modal-backdrop">
  <div class="modal-window">
    <h2>Zarezerwuj wizytę</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Wzór tatuażu:</label>
      <select formControlName="flashId">
        <option value="">Brak wzoru</option>
        <option *ngFor="let flash of flashList" [value]="flash.id">Wzór {{ flash.id }}</option>
      </select>

      <label>Komentarz:</label>
      <textarea formControlName="comment" placeholder="Komentarz"></textarea>

      <div *ngIf="showHealthForm">
        <label>Alergie:</label>
        <input formControlName="allergies" placeholder="Alergie" />

        <label>Choroby przewlekłe:</label>
        <input formControlName="chronicDiseases" placeholder="Choroby przewlekłe" />

        <label>Leki:</label>
        <input formControlName="medicines" placeholder="Leki" />

        <label>Doświadczenia:</label>
        <input formControlName="experiences" placeholder="Doświadczenia" />
      </div>

      <div class="button-row">
        <button type="submit">Rezerwuj</button>
        <button type="button" (click)="cancel()">Anuluj</button>
      </div>
    </form>
  </div>
</div>
