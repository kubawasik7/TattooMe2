<main class="container profile-page">
  <section class="profile-header">
    <div class="profile-picture-wrapper" (click)="isOwner && fileInput.click()">
      <img [src]="previewUrl || defaultAvatar" class="profile-picture" alt="Avatar">
    </div>

    <input #fileInput type="file" accept="image/*" style="display: none" (change)="onFileSelected($event)" />

    <button *ngIf="selectedFile && isLoggedIn && isOwner" (click)="upload()" class="btn2 save-btn">
      Zapisz zdjęcie
    </button>

    <div class="profile-info">
      <div class="nickname-rating">
        <h2 class="nickname" *ngIf="user">{{ user.nickname }}</h2>
        <h2 class="rating" *ngIf="user">★ {{ user.averageRate | number:'1.2-2' }} ({{user.reviewsCount}})</h2>
      </div>
      <app-style [userId]="userId" [isOwner]="isOwner"></app-style>
    </div>


    <div class="profile-buttons">

      <button *ngIf="!isLoggedIn" class="button-chat" [routerLink]="['/login']">
        <i class="fa-solid fa-message"></i> Wyślij wiadomość
      </button>

      <button *ngIf="isLoggedIn && !isOwner" class="button-chat" (click)="goToChats(user.id)">
        <i class="fa-solid fa-message"></i> Wyślij wiadomość
      </button>

      <button *ngIf="!isLoggedIn" class="button-fav" [routerLink]="['/login']">
        <i class="fa-solid fa-heart"></i> Ulubione
      </button>

      <button *ngIf="isLoggedIn && !isOwner && !isFavorite" (click)="addToFavorites(user.id)" class="button-fav">
        <i class="fa-solid fa-heart"></i> Ulubione
      </button>
    </div>
  </section>


  <div class="description" *ngIf="descriptionForm" [formGroup]="descriptionForm">
    <h3 class="section-title">Opis</h3>

    <ng-container *ngIf="!editing; else editTpl">
      <p class="description-text" [class.no-description]="!descriptionForm.get('description')?.value">
        {{ descriptionForm.get('description')?.value || 'Brak opisu...' }}
        <button *ngIf="isOwner" type="button" class="edit-btn" (click)="startEdit()">
          <i class="fas fa-pen"></i>
        </button>
      </p>
    </ng-container>

    <ng-template #editTpl>
      <textarea formControlName="description" rows="3" #autoResize (input)="adjustHeight(autoResize)"
        placeholder="Wpisz swój opis..."></textarea>

      <div class="error" *ngIf="
      descriptionForm.get('description')?.touched &&
      descriptionForm.get('description')?.hasError('maxlength')
    ">
        Opis nie może mieć więcej niż 1000 znaków.
      </div>

      <div class="btn-row">
        <button type="button" class="btn2 saveDesc-btn" (click)="saveDescription()">Zapisz</button>
        <button type="button" class="btn2 cancel-btn" (click)="cancelEdit()">Anuluj</button>
      </div>
    </ng-template>
  </div>

  <app-artist-date [userId]="userId" [isOwner]="isOwner" [isLoggedIn]="isLoggedIn"></app-artist-date>
  <app-special-offer [userId]="userId" [isOwner]="isOwner"></app-special-offer>
  <app-portfolio [userId]="userId" [isOwner]="isOwner"></app-portfolio>
  <app-offer [userId]="userId" [isOwner]="isOwner"></app-offer>
  <app-review *ngIf="isOwner !== undefined" [isOwner]="isOwner" [artistId]="userId"></app-review>
</main>
