<div class="date-list">
  <h4 class="section-title">Wolne terminy</h4>

  <div class="slots-with-add">
    <div class="slots-grid" *ngIf="slots?.length">
      <div *ngFor="let slot of (showAll ? slots : slots | slice:0:5)" class="slot-card"
        [class.unavailable]="!slot.available">

        <div class="slot-time">
          {{ slot.dateTime | date: 'medium' }}
        </div>

        <button *ngIf="!isOwner && slot.available" class="reservation-btn" (click)="book(slot)">
          Zarezerwuj
        </button>

        <div *ngIf="isOwner" class="owner-buttons">
          <button class="delete-btn" (click)="delete(slot.id)">Usuń</button>
          <button class="btn-toggle" [ngClass]="slot.available ? 'deactivate' : 'activate'" (click)="toggle(slot.id)">
            {{ slot.available ? 'Dezaktywuj' : 'Aktywuj' }}
          </button>
        </div>
      </div>
    </div>

    <button *ngIf="isOwner" class="btn add-slot" (click)="openNew()">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <div *ngIf="isNewOpen" class="new-slot-form">
    <input type="datetime-local" [formControl]="slotForm.controls.dateTime">
    <button class="btn save-btn" (click)="saveNew()">Zapisz</button>
    <button class="btn cancel-btn" (click)="closeNew()">Anuluj</button>
  </div>

  <div *ngIf="slots.length > 5" class="text-center mt-3">
    <button class="more-btn" (click)="showAll = !showAll">
      {{ showAll ? 'Pokaż mniej' : 'Pokaż więcej' }}
    </button>
  </div>
</div>

<app-visit *ngIf="showVisitModal" [artistId]="userId" [artistDateId]="selectedSlotId"
  (close)="showVisitModal = false"></app-visit>
