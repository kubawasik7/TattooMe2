<div class="style-section">
  <strong>Style:</strong>

  <div class="style-tags">
    <ng-container *ngIf="!editing">
      <ng-container *ngIf="styles.length > 0; else noStyles">
        <span *ngFor="let style of styles" class="tag readonly selected">
          {{ style.name }}
        </span>
      </ng-container>
      <ng-template #noStyles>
        <span class="no-styles">Brak wybranych styli</span>
      </ng-template>
    </ng-container>

    <ng-container *ngIf="editing">
      <span *ngFor="let style of allStyles" class="tag" [class.selected]="selectedStyleIds.includes(style.id)"
        (click)="toggleStyle(style.id)">
        {{ style.name }}
      </span>
    </ng-container>

    <button *ngIf="!editing && isOwner" class="btn-sm edit-btn" (click)="startEditing()">
      <i class="fas fa-pen"></i>
    </button>
  </div>

  <div class="edit-actions" *ngIf="editing">
    <button *ngIf="isOwner" class="btn save-btn" (click)="saveStyles()">Zapisz</button>
    <button class="btn cancel-btn" (click)="cancelEditing()">Anuluj</button>
  </div>
</div>
