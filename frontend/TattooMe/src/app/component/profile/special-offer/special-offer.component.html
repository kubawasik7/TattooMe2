<div class="offer-section">
  <h3>Aktualne promocje</h3>

  <button *ngIf="isOwner" class="btn-add" (click)="startNew()">+ Dodaj nową</button>

  <div class="offers-container">
    <div class="offer-card" *ngFor="let o of offers">
      <div class="offer-dates">
        <span>Start: {{ o.startDate | date:'short' }}</span>
        <span>Koniec: {{ o.endDate | date:'short' }}</span>
      </div>
      <div class="offer-description">{{ o.description }}</div>
      <div class="action-buttons" *ngIf="isOwner">
        <button class="edit-btn" (click)="startEditOffer(o)">
          <i class="fas fa-pen"></i>
        </button>
        <button class="delete-btn" (click)="delete(o.id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="offer-card editing-card" *ngIf="editingForm" [formGroup]="editingForm">
      <div class="offer-dates">
        <input type="datetime-local" class="form-control" formControlName="startDate" [min]="todayDate">
        <input type="datetime-local" class="form-control" formControlName="endDate" [min]="todayDate">
      </div>
      <div>
        <input type="text" class="form-control" formControlName="description" placeholder="Opis promocji">
        <div class="error"
          *ngIf="editingForm.get('description')?.touched && editingForm.get('description')?.hasError('required')">
          Opis nie może być pusty
        </div>
        <div class="error"
          *ngIf="editingForm.get('description')?.touched && editingForm.get('description')?.hasError('maxlength')">
          Maksymalnie 500 znaków
        </div>
      </div>
      <div class="action-buttons">
        <button class="btn-save" (click)="save()">✔</button>
        <button class="btn-cancel" (click)="cancel()">✖</button>
      </div>
    </div>
  </div>
</div>
