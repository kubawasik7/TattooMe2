<div class="offer-section">
    <h3>Aktualne promocje</h3>
    <button class="btn btn-sm btn-outline-primary" (click)="startNew()">
      + Dodaj nową
    </button>

    <table class="table mt-2">
      <thead>
        <tr>
          <th>Start</th>
          <th>Koniec</th>
          <th>Opis</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let o of offers">
          <td>{{ o.startDate | date:'short' }}</td>
          <td>{{ o.endDate | date:'short' }}</td>
          <td>{{ o.description }}</td>
          <td>
            <button class="btn btn-sm" (click)="startEditOffer(o)">✎</button>
            <button class="btn btn-sm text-danger" (click)="delete(o.id)">🗑</button>
          </td>
        </tr>

        <tr *ngIf="editingId">
          <td>
            <input type="datetime-local" class="form-control" [(ngModel)]="draft.startDate">
          </td>
          <td>
            <input type="datetime-local" class="form-control" [(ngModel)]="draft.endDate">
          </td>
          <td>
            <input type="text" class="form-control" [(ngModel)]="draft.description">
          </td>
          <td>
            <button class="btn btn-sm btn-success" (click)="save()">✔</button>
            <button class="btn btn-sm btn-secondary" (click)="cancel()">✖</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
