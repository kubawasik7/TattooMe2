<div class="offer-section">
  <h3>Aktualne promocje</h3>
  <button *ngIf="isOwner" class="btn-add" (click)="startNew()">
    + Dodaj nową
  </button>

  <table class="table mt-2">
    <thead>
      <tr>
        <th>Start</th>
        <th>Koniec</th>
        <th>Opis</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of offers">
        <td>{{ o.startDate | date:'short' }}</td>
        <td>{{ o.endDate | date:'short' }}</td>
        <td>{{ o.description }}</td>
        <td class="action-buttons">
          <button *ngIf="isOwner" class="edit-btn" (click)="startEditOffer(o)">
            <i class="fas fa-pen"></i>
          </button>
          <button *ngIf="isOwner" class="delete-btn" (click)="delete(o.id)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>

      <tr *ngIf="editingId">
        <td>
          <input type="datetime-local" class="form-control" [(ngModel)]="draft.startDate" [min]="todayDate">
        </td>
        <td>
          <input type="datetime-local" class="form-control" [(ngModel)]="draft.endDate">
        </td>
        <td>
          <input type="text" class="form-control" [(ngModel)]="draft.description">
        </td>
        <td class="action-buttons">
          <button *ngIf="isOwner" class="btn-save" (click)="save()">✔</button>
          <button class="btn-cancel" (click)="cancel()">✖</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
