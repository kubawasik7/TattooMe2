<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <div class="logo">Logo</div>
      <h2>Rejestracja</h2>
      <p>Wybierz rodzaj konta</p>
      <div class="roles">
        <button 
          type="button" 
          (click)="selectRole('user')" 
          [class.active]="selectedRole === 'user'">
          Klient
        </button>
        <button 
          type="button" 
          (click)="selectRole('trainee')" 
          [class.active]="selectedRole === 'trainee'">
          Praktykant
        </button>
        <button 
          type="button" 
          (click)="selectRole('tattoo_artist')" 
          [class.active]="selectedRole === 'tattoo_artist'">
          Tatuator
        </button>
      </div>
    </div>

    <form [formGroup]="form" class="register-form">
      <label>
        Nazwa użytkownika:
        <input formControlName="username" placeholder="Enter your username" />
      </label>
      <div *ngIf="form.get('username')?.touched && form.get('username')?.invalid" class="error">
        Nazwa jest wymagana.
      </div>

      <label>
        Adres E‑mail:
        <input formControlName="email" placeholder="Enter your E‑mail" />
      </label>
      <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="error">
        Podaj poprawny e‑mail.
      </div>

      <label>
        Hasło:
        <input type="password" formControlName="password" placeholder="Enter your password" />
      </label>

      <label>
        Powtórz hasło:
        <input type="password" formControlName="confirmPassword" placeholder="Enter your password" />
      </label>
      <div *ngIf="form.errors?.['notMatching'] && form.get('confirmPassword')?.touched" class="error">
        Hasła muszą być takie same.
      </div>

      <button type="submit" class="submit-btn" (click)="onSubmit()" >
        Zarejestruj się
      </button>
    </form>
  </div>
</div>
