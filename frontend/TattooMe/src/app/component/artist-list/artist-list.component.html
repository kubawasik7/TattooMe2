<div class="tattoo-me">
  <section class="tm-list">
    <article class="tm-card" *ngFor="let user of users | paginate: {
      itemsPerPage: 5,
      currentPage: p,
      totalItems: users.length
    }">

      <div class="avatar">
        <img *ngIf="user?.profilePicture" [src]="'data:image/png;base64,' + user.profilePicture" alt="avatar"
          class="avatar-img" />
        <div *ngIf="!user?.profilePicture" class="avatar-placeholder">
          brak zdjęcia
        </div>
      </div>

      <div class="info">
        <a class="profile-link" [routerLink]="['/profile', user?.id]">
          <h2 class="nickname">{{ user?.nickname }}</h2>
        </a>
        <div class="meta">
          <span class="rating">★ {{ user?.averageRate | number:'1.2-2' }} ({{ user?.reviewsCount }})</span>
          <span class="location">📍 Miasto</span>
        </div>
        <p class="description" *ngIf="user?.description">
          {{ user.description | slice:0:250 }}{{ user.description.length > 250 ? '...' : '' }}
        </p>

        <div class="featured-images" *ngIf="user.featuredPictures.length > 0">
          <div class="featured-item" *ngFor="let pic of user.featuredPictures">
            <img [src]="'data:image/png;base64,' + pic.image" alt="featured tattoo" class="featured-img" />
          </div>
        </div>
      </div>
    </article>
  </section>

  <pagination-controls (pageChange)="p = $event" [autoHide]="true" previousLabel="‹ Prev" nextLabel="Next ›">
  </pagination-controls>
</div>
