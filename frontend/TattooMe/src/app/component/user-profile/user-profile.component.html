<div class="user-profile-container">
  <div class="avatar-upload">
    <label for="avatarInput">
      <div class="avatar-circle">
        <i class="fa fa-upload"></i>
        <span>Wybierz zdjęcie</span>
      </div>
    </label>
    <input type="file" id="avatarInput" hidden />
  </div>

  <form class="user-form">
    <div class="form-group">
      <label>Nazwa użytkownika</label>
      <input type="text" [readonly]="!editMode" [(ngModel)]="user.nickname" name="username" />
    </div>
    <div class="form-group">
      <label>Imię</label>
      <input type="text" [readonly]="!editMode" [(ngModel)]="user.name" name="name" />
    </div>
    <div class="form-group">
      <label>Nazwisko</label>
      <input type="text" [readonly]="!editMode" [(ngModel)]="user.surname" name="surname" />
    </div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" [readonly]="!editMode" [(ngModel)]="user.email" name="email" />
    </div>
  
    <div class="form-actions">
      <button *ngIf="!editMode" type="button" class="edit-btn" (click)="editMode = true">✏️ Edytuj profil</button>

      <ng-container *ngIf="editMode">
        <button type="button" class="save-btn" (click)="saveChanges()">✅ Zapisz zmiany</button>
        <button type="button" class="cancel-btn" (click)="cancelChanges()">❌ Anuluj</button>
      </ng-container>
    </div>
  </form>
</div>
