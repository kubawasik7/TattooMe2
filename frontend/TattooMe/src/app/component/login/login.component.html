<div>
    <h2>Logowanie</h2>
    <form (ngSubmit)="onLogin()">
      <input type="text" placeholder="Nickname" [(ngModel)]="loginRequest.nickname" name="nickname" required />
      <input type="password" placeholder="Password" [(ngModel)]="loginRequest.password" name="password" required />
      <button type="submit">Zaloguj się</button>
    </form>
  </div>
