<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Logowanie</h2>
    </div>

    <form [formGroup]="form" class="login-form">
      <label>
        Nazwa użytkownika:
        <input formControlName="username" placeholder="Wpisz nazwę użytkownika" />
      </label>
      <div *ngIf="form.get('username')?.touched && form.get('username')?.invalid" class="error">
        Nazwa użytkownika jest wymagana.
      </div>

      <label>
        Hasło:
        <input type="password" formControlName="password" placeholder="Wpisz hasło" />
      </label>
      <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="error">
        Hasło jest wymagane.
      </div>

      <button type="submit" class="submit-btn" (click)="onLogin()">
        Zaloguj się
      </button>
    </form>
  </div>
</div>
