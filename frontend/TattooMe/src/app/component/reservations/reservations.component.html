<div class="reservations-container">
  <h2>Historia rezerwacji</h2>

  <div class="tabs">
    <button [class.active]="selectedTab === 'active'" (click)="selectTab('active')">Aktywne</button>
    <button [class.active]="selectedTab === 'past'" (click)="selectTab('past')">Przeszłe</button>
    <button [class.active]="selectedTab === 'cancelled'" (click)="selectTab('cancelled')">Odwołane</button>
  </div>

  <div class="visit-list">
    <div *ngFor="let visit of getCurrentList()" class="visit-card">
      <div class="visit-avatar"></div>
      <div class="visit-info">
        <p class="nickname">{{ visit.artistNickname }}</p>
        <p class="date">{{ visit.date | date:'dd.MM.yyyy' }}</p>
      </div>
      <button class="details-btn" (click)="showDetails(visit)">szczegóły rezerwacji</button>
    </div>
  </div>
</div>
