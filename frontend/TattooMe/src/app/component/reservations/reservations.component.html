<div class="tab-buttons">
  <button [class.active]="selectedTab === 'active'" (click)="selectTab('active')">Aktywne</button>
  <button [class.active]="selectedTab === 'past'" (click)="selectTab('past')">Przeszłe</button>
  <button [class.active]="selectedTab === 'cancelled'" (click)="selectTab('cancelled')">Odwołane</button>
</div>

<div *ngIf="visits.length === 0">Brak rezerwacji w tej kategorii.</div>

<ul *ngIf="visits.length > 0" class="visit-list">
  <li *ngFor="let visit of visits">
    <strong>Status:</strong> {{ visit.status }} <br />
    <strong>Data:</strong> {{ visit.date | date:'short' }} <br />
    <strong>Tatuator:</strong> {{ visit.artistNickname }} <br />
    <strong>Klient:</strong> {{ visit.clientNickname }}
  </li>
</ul>
