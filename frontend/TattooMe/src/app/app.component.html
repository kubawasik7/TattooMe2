
<div class="top-banner">
  <h1>TattooMe</h1>
</div>

<nav class="navbar">
  <ul class="nav-list">
    <li><a href="#">Studia tatuażu</a></li>
    <li><a (click)="navigateTo('tattooArtist')">Tatuatorzy</a></li>
    <li><a (click)="navigateTo('trainee')">Praktykanci</a></li>
    <li><a href="#">Warto wiedzieć</a></li>
    <li><a (click)="navigateTo('contact')">Kontakt</a></li>
  </ul>

  <div class="navbar-right">
    <ng-container *ngIf="!authService.isLoggedIn(); else loggedIn">
      <button (click)="onLoginClick()">Zaloguj się</button>
      <button (click)="navigateTo('register')">Zarejestruj się</button>
    </ng-container>

    <ng-template #loggedIn>
      <a [routerLink]="['/favorites', getUserId()]"><i class="fa fa-heart"></i> Ulubione</a>
      <a href="#">Chat</a>
      <div class="dropdown">
        <span><i class="fa fa-user"></i> {{authService.getNickname()}}</span>
       
      </div>
    </ng-template>
  </div>
</nav>

<div class="container">
  <aside class="sidebar-left">
    <ng-container *ngIf="authService.isLoggedIn()">
      <a [routerLink]="['/profile', getUserId()]">Twój profil</a>
      <a href="#">Rezerwacje</a>
    </ng-container>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <aside class="sidebar-right">
    <ng-container *ngIf="authService.isLoggedIn()">
      <a [routerLink]="['/userProfile', getUserId()]">Dane użytkownika</a>
      <a [routerLink]="['/me', getUserId()]">Informacje o uzytkowniku</a>
      <a href="#" (click)="onLogout()">Wyloguj się</a>
    </ng-container>
  </aside>
</div>
